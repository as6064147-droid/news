<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>لوحة تحكم المحرر - The Spotlight</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <h2 class="text-xl font-bold text-center mb-6 text-slate-800">تسجيل دخول المحرر</h2>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">اسم المستخدم</label>
                <input type="text" id="editor-user" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-left" dir="ltr" placeholder="AHMED1">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">كلمة المرور</label>
                <input type="password" id="editor-pass" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-left" dir="ltr">
            </div>
            <div id="login-error" class="text-red-500 text-sm hidden">اسم المستخدم أو كلمة المرور غير صحيحة</div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl shadow-md hover:bg-indigo-700 transition">دخول المحرر</button>
        </form>
    </div>
</div>

<div id="app" class="hidden min-h-screen p-6 max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl border shadow-sm">
        <h2 class="font-bold text-lg text-indigo-700">✍️ لوحة تحكم المحرر — <span id="who">AHMED1</span></h2>
        <div class="flex gap-3 items-center">
            <a href="index.html" target="_blank" class="text-xs bg-slate-100 px-3 py-2 rounded-lg font-semibold hover:bg-slate-200 transition">فتح الموقع ↗</a>
            <button onclick="logout()" class="text-red-600 text-sm font-semibold hover:underline">تسجيل الخروج</button>
        </div>
    </div>
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
        <h3 class="font-bold text-lg">إدارة الأخبار والمقالات</h3>
        <p class="text-slate-600 text-sm">مرحباً بك يا أحمد، يمكنك من هنا إضافة وتعديل الأخبار بكل سهولة ويسر دون أي قيود.</p>
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
            <input type="text" id="news-title" placeholder="عنوان الخبر الجديد..." class="w-full px-3 py-2 border rounded-xl">
            <textarea id="news-content" placeholder="محتوى الخبر..." rows="4" class="w-full px-3 py-2 border rounded-xl"></textarea>
            <button onclick="publishNews()" class="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-xl shadow hover:bg-indigo-700 transition">نشر الخبر</button>
        </div>
    </div>
</div>

<script>
function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById("editor-user").value.trim();
    const p = document.getElementById("editor-pass").value.trim();
    
    if(u === "AHMED1" && p === "AHMED1") {
        sessionStorage.setItem("editor_logged", "true");
        showApp();
    } else {
        document.getElementById("login-error").classList.remove("hidden");
    }
}

function showApp() {
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
}

function logout() {
    sessionStorage.removeItem("editor_logged");
    location.reload();
}

function publishNews() {
    const title = document.getElementById("news-title").value;
    const content = document.getElementById("news-content").value;
    if(!title || !content) {
        alert("يرجى ملء جميع الحقول");
        return;
    }
    alert("تم نشر الخبر بنجاح!");
    document.getElementById("news-title").value = "";
    document.getElementById("news-content").value = "";
}

if(sessionStorage.getItem("editor_logged") === "true") {
    showApp();
}
</script>
</body>
</html>
