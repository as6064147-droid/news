<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEKO NEWS | Editor Studio & Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header (Matching Main Page) -->
    <header class="bg-slate-950 text-white border-b-4 border-yellow-400 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-400 text-slate-950 rounded-xl flex items-center justify-center font-black text-xl shadow">
                    S
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight uppercase">SHEKO <span class="text-yellow-400">NEWS</span></h1>
                    <p class="text-[11px] text-slate-400 font-semibold tracking-wider uppercase">Editor Control Panel</p>
                </div>
            </div>

            <!-- Quick Navigation -->
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-globe"></i> View Site
                </a>
                <button onclick="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Welcome Banner -->
        <div class="bg-gradient-to-r from-slate-900 to-slate-800 rounded-3xl p-6 md:p-8 text-white mb-8 shadow-xl border border-slate-800 flex justify-between items-center">
            <div>
                <span class="bg-yellow-400 text-slate-950 text-[11px] font-black uppercase px-3 py-1 rounded-full tracking-wider">Studio Active</span>
                <h2 class="text-2xl font-bold mt-3">Welcome Back, Ahmed</h2>
                <p class="text-slate-300 text-sm mt-1">Publish breaking entertainment and sports stories instantly to your portal.</p>
            </div>
            <div class="hidden sm:flex w-14 h-14 bg-yellow-400 text-slate-950 rounded-2xl items-center justify-center text-2xl font-black shadow-lg">
                <i class="fa-solid fa-pen-nib"></i>
            </div>
        </div>

        <!-- Publish Form Card -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 md:p-8 mb-8">
            <h3 class="text-lg font-black text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-2 h-6 bg-yellow-400 rounded-full inline-block"></span>
                Publish New Story
            </h3>
            
            <form id="news-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-slate-600 mb-2">Article Title</label>
                    <input type="text" id="news-title" required placeholder="Enter catchy title..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none font-bold text-slate-900 bg-slate-50">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-black uppercase tracking-wider text-slate-600 mb-2">Category</label>
                        <select id="news-cat" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none font-bold text-slate-900 bg-slate-50">
                            <option value="Entertainment">🎬 Entertainment & Cinema</option>
                            <option value="Sports">⚽ Football & Sports</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-wider text-slate-600 mb-2">Author / Source</label>
                        <input type="text" id="news-author" value="Sheko Newsroom" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none font-bold text-slate-900 bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase tracking-wider text-slate-600 mb-2">Story Content / Summary</label>
                    <textarea id="news-body" rows="5" required placeholder="Write full details here..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none text-slate-900 bg-slate-50"></textarea>
                </div>

                <button type="submit" class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-black py-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Publish to Live Site
                </button>
            </form>
        </div>

        <!-- Published Articles Management List -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 md:p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-black text-slate-900 flex items-center gap-2">
                    <span class="w-2 h-6 bg-slate-900 rounded-full inline-block"></span>
                    Manage Published Articles
                </h3>
                <span id="total-count" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">0 Stories</span>
            </div>
            
            <div id="admin-articles-list" class="space-y-3">
                <p class="text-sm text-slate-500 text-center py-6 font-medium">Loading articles...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 py-6 border-t border-slate-800 mt-12">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center text-xs">
            <p class="font-bold text-white">SHEKO STUDIO &copy; 2026</p>
            <a href="index.html" target="_blank" class="hover:text-yellow-400 transition">Go to Homepage</a>
        </div>
    </footer>

    <!-- Firebase Scripts & Management Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAccVmtHXNNm1eq-rVn-sRraWa7JqLDTQc",
            authDomain: "sheko-3817f.firebaseapp.com",
            databaseURL: "https://sheko-3817f-default-rtdb.firebaseio.com",
            projectId: "sheko-3817f",
            storageBucket: "sheko-3817f.firebasestorage.app",
            messagingSenderId: "267877115512",
            appId: "1:267877115512:web:1efcccf07d090a438e6f8d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Publish Form Submit
        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Publishing...`;

            try {
                await push(ref(db, 'articles'), {
                    title: document.getElementById('news-title').value,
                    category: document.getElementById('news-cat').value,
                    author: document.getElementById('news-author').value,
                    bodyPart1: document.getElementById('news-body').value,
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                    timestamp: Date.now()
                });
                alert('✅ Article published successfully!');
                e.target.reset();
            } catch (err) {
                alert('❌ Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publish to Live Site`;
            }
        });

        // Load & Manage Articles List
        const listContainer = document.getElementById('admin-articles-list');
        const countBadge = document.getElementById('total-count');

        onValue(ref(db, 'articles'), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                const entries = Object.entries(data).reverse();
                countBadge.textContent = `${entries.length} Stories`;

                listContainer.innerHTML = entries.map(([id, article]) => `
                    <div class="flex items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-2xl hover:bg-slate-100/80 transition gap-4">
                        <div class="min-w-0 flex-grow">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-slate-200 text-slate-800 text-[10px] font-black px-2 py-0.5 rounded uppercase">${article.category || 'News'}</span>
                                <span class="text-[11px] text-slate-400 font-semibold">${article.date || ''}</span>
                            </div>
                            <h4 class="font-bold text-slate-900 text-sm truncate">${article.title}</h4>
                        </div>
                        <button onclick="deleteArticle('${id}')" class="w-9 h-9 rounded-xl bg-rose-50 hover:bg-rose-500 text-rose-500 hover:text-white border border-rose-200 transition flex items-center justify-center shrink-0" title="Delete Article">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `).join('');
            } else {
                countBadge.textContent = '0 Stories';
                listContainer.innerHTML = `<p class="text-sm text-slate-400 text-center py-6 font-medium">No published articles yet.</p>`;
            }
        });

        // Delete Function
        window.deleteArticle = async function(id) {
            if (confirm('Are you sure you want to delete this story?')) {
                try {
                    await remove(ref(db, `articles/${id}`));
                } catch (err) {
                    alert('Error deleting: ' + err.message);
                }
            }
        };

        window.logout = function() {
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
