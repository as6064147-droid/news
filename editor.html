<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>صفحة المحررين</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="gate"></div>
<div id="app" hidden>
  <div class="bar"><b>✍️ صفحة المحررين — <span id="who" dir="ltr"></span></b>
    <div style="display:flex;gap:6px"><a href="index.html" target="_blank">افتح الجريدة ↗</a><button onclick="auth.signOut().then(()=>location.reload())">خروج</button></div></div>
  <div class="wrap" id="news"></div>
</div>
<script>
if (!CONFIGURED) document.body.innerHTML = notConfiguredMsg();
else authGate(document.getElementById('gate'), '✍️ دخول المحررين', async u => {
  const email = u.email.toLowerCase();
  const isAdmin = email === ADMIN;
  if (!isAdmin) {
    const r = await db.collection('roles').doc(email).get().catch(() => null);
    if (!r || !r.exists) return denied(document.getElementById('gate'), 'الإيميل ده مش متسجل كمحرر. كلّم مدير الجريدة يضيفك.');
  }
  const S = await loadSettings();
  document.getElementById('who').textContent = email;
  document.getElementById('app').hidden = false;
  articleManager(document.getElementById('news'), { admin: false, email, cats: S.cats });
});
</script>
</body>
</html>
