<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المحرر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }</style>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAccVmtHXNNm1eq-rVn-sRRaWa7JqLDTQc",
            authDomain: "sheko-3817f.firebaseapp.com",
            projectId: "sheko-3817f",
            storageBucket: "sheko-3817f.firebasestorage.app",
            messagingSenderId: "267877115512",
            appId: "1:267877115512:web:1efcccf07d090a438e6f8d",
            measurementId: "G-38KXKP8M5C"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <h2 class="text-xl font-bold text-center mb-6 text-slate-800">تسجيل دخول المحرر</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required class="w-full px-3 py-2 rounded-xl border border-slate-200" placeholder="AHMEDA">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 rounded-xl border border-slate-200">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden">بيانات الدخول غير صحيحة</div>
                <button type="submit" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl">دخول المحرر</button>
            </form>
        </div>
    </div>
    
    <!-- لوحة النشر -->
    <div id="dashboard-screen" class="hidden min-h-screen p-6 max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl border shadow-sm">
            <h2 class="font-bold text-lg text-indigo-700">لوحة المحرر: AHMEDA</h2>
            <div class="space-x-2 space-x-reverse">
                <a href="index.html" target="_blank" class="text-xs bg-slate-100 px-3 py-2 rounded-lg font-semibold">فتح الموقع ↗</a>
                <button onclick="logout()" class="text-red-600 text-sm font-semibold">تسجيل الخروج</button>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl border shadow-sm space-y-4">
            <h3 class="font-bold text-slate-800">إضافة خبر أو مقال جديد</h3>
            <form onsubmit="publishNews(event)" class="space-y-4">
                <input type="text" id="news-title" placeholder="عنوان الخبر الجديد..." required class="w-full px-3 py-2 border rounded-xl">
                <textarea id="news-desc" placeholder="محتوى الخبر..." rows="5" required class="w-full px-3 py-2 border rounded-xl"></textarea>
                <button type="submit" id="publish-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition">نشر الخبر فوراً</button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            if(u === "AHMEDA" || u === "ahmed") {
                sessionStorage.setItem("editor_logged", "true");
                showDash();
            } else {
                document.getElementById("login-error").classList.remove("hidden");
            }
        }
        function showDash() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "block";
        }
        function logout() {
            sessionStorage.removeItem("editor_logged");
            location.reload();
        }
        if(sessionStorage.getItem("editor_logged") === "true") {
            showDash();
        }

        function publishNews(e) {
            e.preventDefault();
            const title = document.getElementById("news-title").value;
            const content = document.getElementById("news-desc").value;
            const btn = document.getElementById("publish-btn");

            btn.disabled = true;
            btn.textContent = "جاري النشر...";

            db.collection("articles").add({
                title: title,
                content: content,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("تم نشر الخبر بنجاح وعرضه على الموقع!");
                e.target.reset();
                btn.disabled = false;
                btn.textContent = "نشر الخبر فوراً";
            }).catch((error) => {
                alert("حدث خطأ أثناء النشر: " + error.message);
                btn.disabled = false;
                btn.textContent = "نشر الخبر فوراً";
            });
        }
    </script>
</body>
</html>
