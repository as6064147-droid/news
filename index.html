<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة عالم موازي - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Login Screen -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-block p-3 bg-indigo-50 rounded-2xl text-indigo-600 mb-3 font-black text-2xl">عالم موازي</div>
                <h1 class="text-xl font-bold text-slate-800">لوحة تحكم المسؤول</h1>
                <p class="text-sm text-slate-500 mt-1">أدخل اسم المستخدم وكلمة المرور للمتابعة</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">اسم المستخدم (Username)</label>
                    <input type="text" id="username" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-left" dir="ltr"
                           placeholder="ahmedsheko123">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">كلمة المرور (Password)</label>
                    <input type="password" id="password" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition text-left" dir="ltr"
                           placeholder="••••••••••••">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden bg-red-50 p-3 rounded-xl text-center"></div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-100">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Screen (Hidden by default) -->
    <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
        <!-- Top Nav -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <span class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl text-sm">أدمن</span>
                <h2 class="font-bold text-lg text-slate-800">لوحة إدارة منصة عالم موازي</h2>
            </div>
            <div class="flex items-center gap-4">
                <span id="user-display" class="text-sm font-semibold text-slate-600">ahmedsheko123</span>
                <button onclick="handleLogout()" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-semibold transition">
                    تسجيل الخروج
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Add Article Form -->
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h3 class="font-bold text-lg text-slate-800 mb-4 pb-2 border-b border-slate-100">إضافة خبر جديد</h3>
                <form id="article-form" onsubmit="handleAddArticle(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">عنوان الخبر</label>
                        <input type="text" id="article-title" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">القسم</label>
                        <select id="article-category" class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="أخبار عامة">أخبار عامة</option>
                            <option value="تحقيقات">تحقيقات</option>
                            <option value="ثقافة وفن">ثقافة وفن</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">محتوى الخبر</label>
                        <textarea id="article-content" rows="4" required class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl transition">
                        نشر الخبر فوراً
                    </button>
                </form>
            </div>

            <!-- Articles Feed List -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="font-bold text-lg text-slate-800 mb-4 pb-2 border-b border-slate-100">الأخـبار المنشورة</h3>
                <div id="articles-list" class="space-y-4">
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                        <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-lg font-semibold">أخبار عامة</span>
                        <h4 class="font-bold text-base mt-2 text-slate-800">إطلاق منصة عالم موازي الإخبارية رسمياً</h4>
                        <p class="text-sm text-slate-600 mt-1">تم إطلاق المنصة بنجاح لتغطية كافة الأحداث المجتمعية والثقافية...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // بيانات الدخول المباشرة (بدون إيميل نهائياً)
        const ADMIN_USER = "ahmedsheko123";
        const ADMIN_PASS = "Aa123456789";

        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                showDashboard();
            }
        };

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            const err = document.getElementById("login-error");

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem("isLoggedIn", "true");
                err.classList.add("hidden");
                showDashboard();
            } else {
                err.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                err.classList.remove("hidden");
            }
        }

        function showDashboard() {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard-screen").classList.remove("hidden");
        }

        function handleLogout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById("dashboard-screen").classList.add("hidden");
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("login-form").reset();
        }

        function handleAddArticle(e) {
            e.preventDefault();
            const title = document.getElementById("article-title").value;
            const category = document.getElementById("article-category").value;
            const content = document.getElementById("article-content").value;

            const list = document.getElementById("articles-list");
            const newCard = document.createElement("div");
            newCard.className = "p-4 bg-slate-50 rounded-xl border border-slate-100";
            newCard.innerHTML = `
                <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-lg font-semibold">${category}</span>
                <h4 class="font-bold text-base mt-2 text-slate-800">${title}</h4>
                <p class="text-sm text-slate-600 mt-1">${content}</p>
            `;
            list.prepend(newCard);
            document.getElementById("article-form").reset();
            alert("تم نشر الخبر بنجاح!");
        }
    </script>
</body>
</html>
