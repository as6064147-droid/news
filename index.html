<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>بوابة الأخبار</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background: #f8fafc; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto text-center py-10">
        <h1 class="text-3xl font-black mb-4">بوابة الأخبار الاحترافية</h1>
        <p class="text-slate-600 mb-6">الموقع يعمل بنجاح، يمكنك نشر الأخبار عبر لوحة المحررين.</p>
        <div class="space-x-4 space-x-reverse">
            <a href="editor.html" class="bg-yellow-400 font-bold px-4 py-2 rounded-lg">بوابة المحرر</a>
            <a href="admin.html" class="bg-slate-900 text-white font-bold px-4 py-2 rounded-lg">الإدارة</a>
        </div>
        <div id="news" class="mt-8 grid gap-4 text-right"></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        const db = getDatabase(initializeApp({
            databaseURL: "https://sheko-3817f-default-rtdb.firebaseio.com"
        }));
        get(ref(db, 'articles')).then(snap => {
            if(snap.exists()) {
                let html = '';
                Object.values(snap.val()).forEach(item => {
                    html += `<div class="bg-white p-4 rounded-xl shadow border"><h3 class="font-bold text-lg">${item.title}</h3><p class="text-sm text-slate-600">${item.bodyPart1 || ''}</p></div>`;
                });
                document.getElementById('news').innerHTML = html;
            }
        });
    </script>
</body>
</html>
