<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأخبار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }</style>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAccVmtHXNNm1eq-rVn-sRRaWa7JqLDTQc",
            authDomain: "sheko-3817f.firebaseapp.com",
            projectId: "sheko-3817f",
            storageBucket: "sheko-3817f.firebasestorage.app",
            messagingSenderId: "267877115512",
            appId: "1:267877115512:web:1efcccf07d090a438e6f8d",
            measurementId: "G-38KXKP8M5C"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-black text-indigo-600">منصة الأخبار</h1>
        <div class="space-x-2 space-x-reverse">
            <a href="editor.html" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-semibold transition">لوحة المحرر</a>
            <a href="admin.html" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg font-semibold transition">لوحة الأدمن</a>
        </div>
    </header>
    <main class="max-w-4xl mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-slate-800">آخر الأخبار والمقالات</h2>
        <div id="public-articles" class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-slate-500">جاري تحميل الأخبار...</p>
            </div>
        </div>
    </main>

    <script>
        db.collection("articles").orderBy("createdAt", "desc").get().then((snapshot) => {
            const container = document.getElementById("public-articles");
            if(snapshot.empty) {
                container.innerHTML = "<div class='bg-white p-6 rounded-2xl shadow-sm border text-slate-500'>لا توجد أخبار منشورة حتى الآن.</div>";
                return;
            }
            let html = "";
            snapshot.forEach((doc) => {
                const art = doc.data();
                html += `
                    <article class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <h3 class="text-xl font-bold text-slate-900">${art.title}</h3>
                        <p class="text-slate-600 leading-relaxed whitespace-pre-line">${art.content}</p>
                    </article>
                `;
            });
            container.innerHTML = html;
        }).catch((err) => {
            document.getElementById("public-articles").innerHTML = "<div class='bg-white p-6 rounded-2xl shadow-sm border text-red-500'>خطأ في الاتصال بقاعدة البيانات.</div>";
        });
    </script>
</body>
</html>
