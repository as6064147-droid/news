<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin Dashboard - The Spotlight</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="panel.css">
<style>
.wrap.wide{max-width:1400px}
.design{display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:start}
.preview{position:sticky;top:70px;height:calc(100vh - 90px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px #0001}
.preview iframe{width:100%;height:100%;border:0}
.logo-edit{display:flex;align-items:center;gap:16px}
.logo-prev{width:100px;height:100px;border-radius:50%;background:#eee;overflow:hidden;display:grid;place-items:center;cursor:pointer;border:3px solid #ccc;font-size:12px;color:#888;text-align:center;flex-shrink:0}
.logo-prev img{width:100%;height:100%;object-fit:cover}
.clist{display:grid;gap:6px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:#242424;font-size:14px}
.crow input{width:54px;height:34px;border:1px solid #444;border-radius:8px;cursor:pointer;padding:1px;background:#1e1e1e}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.themes button{border:1px solid #444;border-radius:20px;padding:5px 12px;cursor:pointer;background:#1e1e1e;color:#f2f2f2;font:inherit;font-size:14px}
.save-bar{position:sticky;bottom:0;background:#1e1e1e;padding:12px;border-radius:14px;box-shadow:0 -4px 14px #0004;display:flex;gap:8px}
.save-bar .btn{flex:1}
.ed{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #333;gap:10px;flex-wrap:wrap}
.hint{background:#2a2615;color:#f5c518;padding:12px;border-radius:10px;font-size:14px;margin-bottom:14px}
.ed-form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
@media(max-width:1000px){.design{grid-template-columns:1fr}.preview{position:static;height:600px}.ed-form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gate"></div>
<div id="app" hidden>
  <div class="bar"><b>👑 Admin Dashboard</b>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><a href="index.html" target="_blank">Open Site ↗</a><button onclick="localStorage.removeItem('isAdminLoggedIn'); location.reload();">Sign Out</button></div></div>
  <div class="wrap wide">
    <div class="tabs" id="tabs">
      <button data-t="news" class="on">📰 Articles</button>
      <button data-t="design">🎨 Design & Colors</button>
      <button data-t="content">📋 Categories & Ticker</button>
      <button data-t="editors">👥 Editors</button>
    </div>

    <div data-p="news"><div style="max-width:900px" id="news"></div></div>

    <div data-p="design" hidden><div class="design">
      <div>
        <div class="box"><h3>Title & Logo</h3>
          <div class="logo-edit">
            <div class="logo-prev" id="logoPrev"></div>
            <div><button class="mini" id="logoUp">📷 Upload Logo</button><br><br><button class="mini danger" id="logoDel">Remove Logo</button></div>
          </div><br>
          <label>Site Name<input type="text" id="iName"></label>
          <label>Subtitle / Slogan<input type="text" id="iSlogan"></label>
        </div>
        <div class="box"><h3>Colors</h3>
          <p class="muted" style="font-size:14px;margin-bottom:8px">Choose a theme or customize individual colors:</p>
          <div class="themes" id="themes"></div>
          <div class="clist" id="clist"></div>
        </div>
        <div class="save-bar"><button class="btn" onclick="saveSettings()">💾 Save & Publish Design</button><button class="btn ghost" onclick="resetDesign()">↩ Revert</button></div>
      </div>
      <div class="preview"><iframe id="frame" src="index.html?preview=1"></iframe></div>
    </div></div>

    <div data-p="content" hidden><div style="max-width:900px">
      <div class="box"><h3>Categories</h3>
        <label>Write each category on a new line<textarea id="iCats" rows="7"></textarea></label></div>
      <div class="box"><h3>Breaking News Ticker</h3>
        <label>Write each breaking news item on a new line<textarea id="iTicker" rows="6"></textarea></label></div>
      <button class="btn" onclick="saveSettings()">💾 Save Changes</button>
    </div></div>

    <div data-p="editors" hidden><div style="max-width:900px">
      <div class="box"><h3>Create Editor Account</h3>
        <div class="hint">Set an email and password for your editor, then send them the link and credentials:<br><b dir="ltr" id="edLink"></b> <button class="mini" onclick="navigator.clipboard.writeText(document.getElementById('edLink').textContent).then(()=>toast('Link Copied'))">Copy Link</button></div>
        <div class="ed-form">
          <input type="email" id="edEmail" dir="ltr" placeholder="editor@gmail.com" style="margin:0">
          <input type="text" id="edPass" dir="ltr" placeholder="Password (min 6 chars)" style="margin:0">
          <button class="btn" id="addEdBtn" onclick="addEditor()">Create Account</button>
        </div>
      </div>
      <div class="box"><h3>Current Editors</h3><div id="edList">Loading...</div></div>
    </div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let S, SAVED;

function checkAdminLogin() {
  const gate = $('gate');
  if (localStorage.getItem('isAdminLoggedIn') === 'true') {
    gate.hidden = true;
    initAdmin();
    return;
  }
  gate.hidden = false;
  gate.innerHTML = `<div class="login"><h2>👑 Admin Sign In</h2>
    <label>Username<input id="adminUser" type="text" dir="ltr" placeholder="Username"></label>
    <label>Password<input id="adminPass" type="password" dir="ltr" placeholder="Password"></label>
    <button class="btn" id="adminLoginBtn">Sign In</button>
    <p class="msg" id="adminMsg"></p></div>`;

  gate.querySelector('#adminLoginBtn').onclick = () => {
    const u = gate.querySelector('#adminUser').value.trim();
    const p = gate.querySelector('#adminPass').value.trim();
    if (u === 'ahmedsheko123' && p === 'Aa123456789') {
      localStorage.setItem('isAdminLoggedIn', 'true');
      gate.hidden = true;
      initAdmin();
    } else {
      gate.querySelector('#adminMsg').textContent = 'Invalid username or password';
    }
  };
}

async function initAdmin() {
  $('app').hidden = false;
  S = await loadSettings(); SAVED = JSON.parse(JSON.stringify(S));
  fillForms();
  articleManager($('news'), { admin: true, email: 'ahmedsheko123@admin.com', cats: S.cats });
  loadEditors();
}

if (!CONFIGURED) document.body.innerHTML = notConfiguredMsg();
else checkAdminLogin();

$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('[data-p]').forEach(p => p.hidden = p.dataset.p !== b.dataset.t);
  if (b.dataset.t === 'design') preview();
};

function fillForms() {
  $('iName').value = S.name; $('iSlogan').value = S.slogan;
  $('iCats').value = S.cats.join('\n'); $('iTicker').value = String(S.ticker || '').split('|').join('\n');
  $('themes').innerHTML = Object.keys(THEMES).map(t => `<button data-th="${t}">${t}</button>`).join('');
  drawColors(); drawLogo();
  $('edLink').textContent = location.href.replace(/admin\.html.*$/, 'editor.html');
}
function drawColors() {
  $('clist').innerHTML = COLORS.map(([k, label]) => `<div class="crow"><span>${label}</span><input type="color" data-k="${k}" value="${S.colors[k]}"></div>`).join('');
}
function drawLogo() { $('logoPrev').innerHTML = S.logo ? `<img src="${S.logo}">` : 'Click<br>to add<br>logo'; }
$('clist').oninput = e => { if (e.target.dataset.k) { S.colors[e.target.dataset.k] = e.target.value; preview(); } };
$('themes').onclick = e => { const t = e.target.dataset.th; if (!t) return; S.colors = { ...DEFAULT_COLORS, ...THEMES[t] }; drawColors(); preview(); };
$('iName').oninput = e => { S.name = e.target.value; preview(); };
$('iSlogan').oninput = e => { S.slogan = e.target.value; preview(); };

const logoFile = document.createElement('input'); logoFile.type = 'file'; logoFile.accept = 'image/*';
$('logoPrev').onclick = $('logoUp').onclick = () => logoFile.click();
logoFile.onchange = async () => {
  if (!logoFile.files[0]) return;
  try { S.logo = await compressImage(logoFile.files[0], 300, 0.9, 'image/png'); drawLogo(); preview(); } catch (e) { toast(e.message); }
  logoFile.value = '';
};
$('logoDel').onclick = () => { S.logo = ''; drawLogo(); preview(); };

function preview() { const f = $('frame'); if (f.contentWindow) f.contentWindow.postMessage({ type: 'preview', settings: S }, location.origin); }
$('frame').onload = () => setTimeout(preview, 300);
function resetDesign() { S = JSON.parse(JSON.stringify(SAVED)); fillForms(); preview(); toast('Reverted to saved design'); }

async function saveSettings() {
  S.cats = $('iCats').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!S.cats.length) return toast('At least one category is required');
  S.ticker = $('iTicker').value;
  try {
    await db.doc('site/settings').set(S);
    SAVED = JSON.parse(JSON.stringify(S));
    toast('Saved successfully ✔');
  } catch (e) { toast('Could not save: ' + e.message); }
}

async function loadEditors() {
  try {
    const s = await db.collection('roles').get();
    $('edList').innerHTML = s.docs.length ? s.docs.map(d => {
      const data = d.data();
      const passInfo = data.tempPass ? ` · Pass: <b style="color:#f5c518">${esc(data.tempPass)}</b>` : '';
      return `<div class="ed">
        <div><span dir="ltr">${esc(d.id)}</span><small class="muted" style="display:block">${passInfo}</small></div>
        <div style="display:flex;gap:6px">
          ${data.tempPass ? `<button class="mini" onclick="navigator.clipboard.writeText('Link: ' + document.getElementById('edLink').textContent + '\nEmail: ${esc(d.id)}\nPassword: ${esc(data.tempPass)}').then(()=>toast('Credentials Copied!'))">📋 Copy Info</button>` : ''}
          <button class="mini danger" data-e="${esc(d.id)}">Remove</button>
        </div>
      </div>`;
    }).join('') : '<p class="muted">No editors added yet</p>';
  } catch (e) { $('edList').textContent = 'Error: ' + e.message; }
}

async function addEditor() {
  const em = $('edEmail').value.trim().toLowerCase();
  const pw = $('edPass').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Please enter a valid email');
  if (pw.length < 6) return toast('Password must be at least 6 characters');
  
  const btn = $('addEdBtn');
  btn.disabled = true; btn.textContent = 'Creating...';
  
  let secApp;
  try {
    secApp = firebase.initializeApp(firebaseConfig, 'sec_' + Date.now());
    await secApp.auth().createUserWithEmailAndPassword(em, pw);
    await secApp.auth().signOut();
    await secApp.delete();
  } catch (e) {
    if (secApp) await secApp.delete().catch(()=>{});
    if (e.code !== 'auth/email-already-in-use') {
      btn.disabled = false; btn.textContent = 'Create Account';
      return toast(authErr(e));
    }
  }
  
  try {
    await db.collection('roles').doc(em).set({
      role: 'editor',
      tempPass: pw,
      added: firebase.firestore.FieldValue.serverTimestamp()
    });
    $('edEmail').value = '';
    $('edPass').value = '';
    toast('Editor account created ✔');
    loadEditors();
  } catch (e) {
    toast('Error: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'Create Account';
}

$('edList').onclick = async e => {
  const em = e.target.dataset.e; if (!em) return;
  if (!confirm('Remove ' + em + ' from editors?')) return;
  await db.collection('roles').doc(em).delete(); loadEditors();
};
</script>
</body>
</html>
