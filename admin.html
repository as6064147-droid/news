<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }</style>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAccVmtHXNNm1eq-rVn-sRRaWa7JqLDTQc",
            authDomain: "sheko-3817f.firebaseapp.com",
            projectId: "sheko-3817f",
            storageBucket: "sheko-3817f.firebasestorage.app",
            messagingSenderId: "267877115512",
            appId: "1:267877115512:web:1efcccf07d090a438e6f8d",
            measurementId: "G-38KXKP8M5C"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <h2 class="text-xl font-bold text-center mb-6 text-slate-800">تسجيل دخول المسؤول (Admin)</h2>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسم المستخدم</label>
                    <input type="text" id="admin-user" required class="w-full px-3 py-2 rounded-xl border border-slate-200" placeholder="ahmedsheko123">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">كلمة المرور</label>
                    <input type="password" id="admin-pass" required class="w-full px-3 py-2 rounded-xl border border-slate-200">
                </div>
                <div id="admin-error" class="text-red-500 text-sm hidden">بيانات الدخول غير صحيحة</div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl">دخول المسؤول</button>
            </form>
        </div>
    </div>
    
    <!-- لوحة التحكم -->
    <div id="dashboard-screen" class="hidden min-h-screen p-6 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl border shadow-sm">
            <h2 class="font-bold text-lg text-indigo-700">لوحة تحكم المسؤول الشاملة</h2>
            <div class="space-x-2 space-x-reverse">
                <a href="index.html" target="_blank" class="text-xs bg-slate-100 px-3 py-2 rounded-lg font-semibold">فتح الموقع ↗</a>
                <button onclick="logout()" class="text-red-600 text-sm font-semibold">تسجيل الخروج</button>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <h3 class="font-bold mb-4 text-slate-800">إدارة الأخبار المحفوظة</h3>
                <div id="admin-articles-list" class="space-y-2 text-sm text-slate-600">
                    <p>جاري تحميل المقالات...</p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <h3 class="font-bold mb-4 text-slate-800">إعدادات النظام والاتصال</h3>
                <p class="text-sm text-slate-500 mb-4">متصل بقاعدة بيانات Firebase (`sheko-3817f`). يمكنك التحكم بالكامل في الأخبار وحذفها أو تعديلها.</p>
                <div class="p-3 bg-indigo-50 text-indigo-700 rounded-xl text-sm font-semibold text-center">
                    الحالة: متصل وجاهز للعمل 🟢
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById("admin-user").value;
            const p = document.getElementById("admin-pass").value;
            if(u === "ahmedsheko123" && p === "Aa123456789") {
                sessionStorage.setItem("admin_logged", "true");
                showDash();
            } else {
                document.getElementById("admin-error").classList.remove("hidden");
            }
        }
        function showDash() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "block";
            loadAdminArticles();
        }
        function logout() {
            sessionStorage.removeItem("admin_logged");
            location.reload();
        }
        if(sessionStorage.getItem("admin_logged") === "true") {
            showDash();
        }

        function loadAdminArticles() {
            const container = document.getElementById("admin-articles-list");
            db.collection("articles").orderBy("createdAt", "desc").get().then((querySnapshot) => {
                if(querySnapshot.empty) {
                    container.innerHTML = "<p class='text-slate-400'>لا توجد أخبار منشورة حالياً.</p>";
                    return;
                }
                let html = "";
                querySnapshot.forEach((doc) => {
                    const article = doc.data();
                    html += `
                        <div class="p-3 bg-slate-50 rounded-lg border flex justify-between items-center">
                            <span class="font-semibold truncate max-w-[200px]">${article.title}</span>
                            <button onclick="deleteArticle('${doc.id}')" class="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-200 transition">حذف</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }).catch((error) => {
                container.innerHTML = "<p class='text-red-500'>خطأ في جلب البيانات من القاعدة.</p>";
            });
        }

        function deleteArticle(id) {
            if(confirm("هل أنت متأكد من حذف هذا الخبر نهائياً؟")) {
                db.collection("articles").doc(id).delete().then(() => {
                    alert("تم حذف الخبر بنجاح!");
                    loadAdminArticles();
                }).catch((error) => {
                    alert("حدث خطأ أثناء الحذف.");
                });
            }
        }
    </script>
</body>
</html>
